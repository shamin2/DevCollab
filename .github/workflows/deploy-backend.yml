name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/DevCollab
            git pull origin main

            cd backend

            sudo docker build -t devcollab-backend .

            sudo docker rm -f devcollab-backend || true

            sudo docker run -d \
              --name devcollab-backend \
              --env-file .env.production \
              -p 5001:5001 \
              --restart unless-stopped \
              devcollab-backend

            sudo docker image prune -f