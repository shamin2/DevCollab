name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy backend through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-04f5b0af7f7ef2788" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ec2-user git -C /home/ec2-user/DevCollab pull origin main",
              "cd /home/ec2-user/DevCollab/backend",
              "docker build -t devcollab-backend .",
              "docker rm -f devcollab-backend || true",
              "docker run -d --name devcollab-backend --env-file .env.production -p 5001:5001 --restart unless-stopped devcollab-backend",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04f5b0af7f7ef2788"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-04f5b0af7f7ef2788"